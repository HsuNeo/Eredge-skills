name: Check skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skill-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check standalone skill entrypoints and references
        run: |
          python tools/check_skills.py --self-test
          python tools/check_skills.py
  total-commander-config:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\skills\total-commander-config\scripts\Test-TcConfig.SelfTest.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\skills\total-commander-config\scripts\Test-TcConfig.SelfTest.ps1
