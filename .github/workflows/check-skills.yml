name: Check skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  total-commander-config:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\skills\total-commander-config\scripts\Test-TcConfig.SelfTest.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\skills\total-commander-config\scripts\Test-TcConfig.SelfTest.ps1
